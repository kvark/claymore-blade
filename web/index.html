<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Claymore</title>
    <meta name="description" content="A roleplaying tactical hunt. Walk the island. Cut the board." />
    <meta name="theme-color" content="#0b0a09" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:type" content="x:game" />
    <meta property="og:title" content="Claymore" />
    <meta property="og:image" content="./og.jpg" />
    <meta property="x:game:image" content="./x-banner.jpg" />
    <meta property="x:game:image:width" content="1200" />
    <meta property="x:game:image:height" content="264" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        background: #0b0a09;
        color: #c8c0b0;
        font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #8a8070;
        pointer-events: none;
        user-select: none;
      }
      #boot .title {
        font-size: 1.05rem;
      }
      #boot .bar {
        width: min(220px, 56vw);
        height: 3px;
        background: #1c1a18;
        border-radius: 2px;
        overflow: hidden;
      }
      #boot .fill {
        height: 100%;
        width: 8%;
        background: #9a2430;
        border-radius: 2px;
        animation: boot-pulse 1.1s ease-in-out infinite;
      }
      #boot .hint {
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        color: #5a5248;
        text-transform: none;
      }
      @keyframes boot-pulse {
        0%   { width: 8%;  opacity: 0.55; }
        50%  { width: 72%; opacity: 1; }
        100% { width: 8%;  opacity: 0.55; }
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: url("./kenney/cursor/pointer.png") 6 2, crosshair;
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="title">Claymore</div>
      <div class="bar"><div class="fill"></div></div>
      <div class="hint">loading</div>
    </div>
    <script type="module">
      import init, { start } from "./claymore.js";
      const boot = document.getElementById("boot");
      const hint = boot && boot.querySelector(".hint");
      init()
        .then(() => {
          if (hint) hint.textContent = "starting";
          // winit EventLoop::run has return type `!`. On web it spawns the
          // loop then throws so the function never returns. Ignore that
          // intentional exception; the canvas is already live.
          try {
            start();
          } catch (err) {
            if (!String(err).includes("Using exceptions for control flow")) {
              throw err;
            }
          }
          if (boot) boot.remove();
        })
        .catch((err) => {
          if (boot) {
            boot.innerHTML = "";
            const msg = document.createElement("div");
            msg.style.cssText =
              "max-width:80vw;padding:1rem;text-align:center;letter-spacing:0.04em;color:#9a2430;text-transform:none;line-height:1.5";
            msg.textContent = String(err);
            boot.appendChild(msg);
          }
          console.error(err);
        });
    </script>
  </body>
</html>
