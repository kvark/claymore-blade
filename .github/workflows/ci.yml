name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: native

      - name: System deps (EGL / GLES for --cfg gles)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      - name: Unit tests
        run: cargo test --lib -- --nocapture

      - name: Vulkan-path compile smoke
        run: cargo check --lib --bins

      - name: GLES-path compile smoke
        env:
          RUSTFLAGS: "--cfg gles"
          CARGO_TARGET_DIR: target-gles
        run: |
          # Vulkan PipelineEncoder<'a,'a> vs GLES PipelineEncoder<'a>
          # Prefer src/pipe_enc.rs once gpu.rs is switched over permanently.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/gpu.rs")
          t = p.read_text()
          old = """#[cfg(target_arch = \"wasm32\")]\ntype PipeEnc<'a> = gpu::PipelineEncoder<'a>;\n#[cfg(not(target_arch = \"wasm32\"))]\ntype PipeEnc<'a> = gpu::PipelineEncoder<'a, 'a>;"""
          new = "use crate::pipe_enc::PipeEnc;"
          if old in t:
              p.write_text(t.replace(old, new, 1))
              print("patched gpu.rs PipeEnc for GLES")
          elif "use crate::pipe_enc::PipeEnc" in t:
              print("gpu.rs already uses pipe_enc")
          else:
              raise SystemExit("unexpected PipeEnc form in src/gpu.rs")
          PY
          cargo check --lib --bins
