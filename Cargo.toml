[package]
name = "claymore"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kvark/claymore-blade"
description = "Roleplaying tactical hunt. Blade raster, isometric hex."

[lib]
path = "rust/lib.rs"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["mint"] }
log = "0.4"
mint = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
